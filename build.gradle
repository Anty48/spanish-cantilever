plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'com.hypherionmc.modutils.modpublisher' version '2.2.4'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            // PNW, Create, DragonLib... traen mixins con refmap en nombres SRG: en el entorno de
            // desarrollo (nombres oficiales) hay que remapearlos o no cargan.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            args '--width', '1280', '--height', '720'
        }

        // Igual que client, pero crea un mundo plano de prueba, monta las mensulas, hace capturas
        // en run/screenshots/ y cierra el juego (ver dev/AutoTest.java).
        autotest {
            parent runs.client
            taskName 'runAutoTest'
            property 'spanishcantilevers.autotest', 'true'
            args '--width', '1280', '--height', '720'
        }

        server {
            args '--nogui'
        }
    }
}

repositories {
    // Jars de PNW y sus dependencias en ./libs (nombre: artefacto-version.jar). fg.deobf los remapea.
    flatDir {
        dir 'libs'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // PNW es dependencia OBLIGATORIA (ver mods.toml). Compilamos contra el y lo cargamos en el runClient.
    implementation fg.deobf("local:pantographsandwires:0.2.3")
    implementation fg.deobf("local:dragonlib:3.0.28")
    implementation fg.deobf("local:create:6.0.8.1")  // copia SIN jar-in-jar (Registrate etc. van aparte; si no, se cargan dos veces)
    implementation fg.deobf("local:flywheel:1.0.5")
    implementation fg.deobf("local:registrate:1.3.3")
    implementation fg.deobf("local:ponder:1.0.91")
    implementation fg.deobf("local:geckolib:4.8.4")  // el pantografo espanol usa su renderer
    runtimeOnly fg.deobf("local:architectury:9.2.14")
    runtimeOnly fg.deobf("local:jei:15.62.0.217")  // solo para ver recetas al probar (las de Create incluidas)
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            pnw_version_range: pnw_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// --- Publicacion en CurseForge y Modrinth (modpublisher) ---
// Tokens por variables de entorno: CURSE_TOKEN y MODRINTH_TOKEN. Notas de la version: release-notes.md.
// Tareas: publishMod (todo) o publishCurseforge / publishModrinth. -PpublishDryRun simula sin subir.
// El port NeoForge 1.21.1 vive en la rama neoforge-1.21.1 (proyecto aparte) y publica en los mismos proyectos.
publisher {
    apiKeys {
        curseforge System.getenv('CURSE_TOKEN')
        modrinth System.getenv('MODRINTH_TOKEN')
    }

    setCurseID(curseforge_id)
    setModrinthID(modrinth_id)
    setDebug(project.hasProperty('publishDryRun'))
    setVersionType('beta')
    setChangelog(file('release-notes.md'))
    setProjectVersion(project.version.toString())
    setDisplayName("Spanish Cantilevers ${project.version} (Forge 1.20.1)")
    setGameVersions(*publish_game_versions.split(',').collect { it.trim() })
    setLoaders('forge')
    setCurseEnvironment('both')
    javaVersions.set([JavaVersion.VERSION_17])
    setArtifact("build/libs/${mod_id}-${project.version}.jar")

    curseDepends {
        required 'create-pantographs-and-wires', 'create', 'dragonlib', 'geckolib'
    }
    modrinthDepends {
        required 'create-pantographs-and-wires', 'create', 'dragonlib', 'geckolib'
    }
}

['publishMod', 'publishCurseforge', 'publishModrinth'].each { name ->
    tasks.matching { it.name == name }.configureEach { dependsOn 'build' }
}
