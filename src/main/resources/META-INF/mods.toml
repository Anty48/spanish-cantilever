modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="Usa Create: Pantographs & Wires de MrJulsen (GPL-3.0): sus postes, cables y su sistema de colocacion."
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="pantographsandwires"
    mandatory=true
    versionRange="${pnw_version_range}"
    ordering="AFTER"
    side="BOTH"

# el pantografo iberico usa directamente el renderer de GeckoLib (PNW ya lo pide)
[[dependencies.${mod_id}]]
    modId="geckolib"
    mandatory=true
    versionRange="[4.4,)"
    ordering="AFTER"
    side="BOTH"
