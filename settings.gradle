            name = 'FirstDark (modpublisher)'
            url = 'https://maven.firstdark.dev/releases'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'spanishcantilevers-neoforge'
